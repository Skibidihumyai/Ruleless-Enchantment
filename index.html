<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruleless Enchantment Loader</title>
    
    <!-- TailwindCSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- ใช้ Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a0a0a; }
        .glow-text { text-shadow: 0 0 40px rgba(255, 0, 0, 0.3); }
        .btn-copy { transition: all 0.2s ease; }
        .btn-copy:hover { transform: scale(1.03); }
        .copy-feedback { transition: opacity 0.3s ease; }
        .code-block {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #e0e0e0;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .badge {
            background: rgba(255, 50, 50, 0.15);
            color: #ff6b6b;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 50, 50, 0.2);
        }
        .footer-text {
            color: #4a4a4a;
            font-size: 0.75rem;
        }
        .footer-text a {
            color: #6a6a6a;
            text-decoration: none;
        }
        .footer-text a:hover { color: #aaa; }
    </style>
</head>
<body>

    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="max-w-2xl w-full">

            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-white glow-text tracking-tight">
                    ⚡ Ruleless Enchantment
                </h1>
                <p class="text-gray-400 mt-2 text-sm">
                    Murder vs Sheriff Duels — Loader
                </p>
                <div class="flex justify-center gap-2 mt-3">
                    <span class="badge"><i class="fa-solid fa-shield-halved mr-1"></i> UNDETECTABLE</span>
                    <span class="badge" style="background:rgba(50,255,100,0.1);color:#50ff80;border-color:rgba(50,255,100,0.2);">
                        <i class="fa-solid fa-bolt mr-1"></i> v4.2.7
                    </span>
                </div>
            </div>

            <!-- Card -->
            <div class="bg-[#141414] rounded-2xl border border-[#222] p-6 shadow-2xl shadow-red-500/5">
                
                <!-- Loadstring Display -->
                <div class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-gray-300 text-sm font-medium">
                            <i class="fa-solid fa-terminal mr-2 text-red-400"></i> Loadstring
                        </span>
                        <span class="text-xs text-gray-500">Click to copy</span>
                    </div>
                    <div id="loadstringDisplay" class="code-block select-all">
                        loadstring(game:HttpGet("https://raw.githubusercontent.com/ชื่อคุณ/ชื่อrepo/main/script.lua"))()
                    </div>
                </div>

                <!-- Copy Button -->
                <button id="copyBtn" class="btn-copy w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-regular fa-clipboard"></i>
                    <span id="copyText">Copy Loadstring</span>
                </button>

                <!-- Feedback -->
                <div id="feedback" class="copy-feedback text-center text-sm mt-3 text-emerald-400 opacity-0">
                    <i class="fa-regular fa-circle-check mr-1"></i> Copied to clipboard!
                </div>

                <!-- Security Note -->
                <p class="text-xs text-gray-600 text-center mt-5">
                    <i class="fa-regular fa-eye mr-1"></i> 
                    View page source to inspect the Lua script
                </p>
            </div>

            <!-- Footer -->
            <div class="footer-text text-center mt-6">
                <span>Built with ❤️ ·</span>
                <a href="https://github.com/ชื่อคุณ/ชื่อrepo" target="_blank">
                    <i class="fa-brands fa-github mr-1"></i> GitHub
                </a>
            </div>

        </div>
    </div>

    <script>
        (function() {
            const loadstringText = `loadstring(game:HttpGet("https://raw.githubusercontent.com/ชื่อคุณ/ชื่อrepo/main/script.lua"))()`;
            const display = document.getElementById('loadstringDisplay');
            const copyBtn = document.getElementById('copyBtn');
            const copyText = document.getElementById('copyText');
            const feedback = document.getElementById('feedback');
            let timeout = null;

            // ใส่ loadstring ลงใน display
            display.textContent = loadstringText;

            function copyLoadstring() {
                navigator.clipboard.writeText(loadstringText).then(() => {
                    copyText.textContent = 'Copied!';
                    feedback.classList.remove('opacity-0');
                    feedback.classList.add('opacity-100');
                    clearTimeout(timeout);
                    timeout = setTimeout(() => {
                        copyText.textContent = 'Copy Loadstring';
                        feedback.classList.remove('opacity-100');
                        feedback.classList.add('opacity-0');
                    }, 2000);
                }).catch(() => {
                    // Fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = loadstringText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    copyText.textContent = 'Copied!';
                    feedback.classList.remove('opacity-0');
                    feedback.classList.add('opacity-100');
                    setTimeout(() => {
                        copyText.textContent = 'Copy Loadstring';
                        feedback.classList.remove('opacity-100');
                        feedback.classList.add('opacity-0');
                    }, 2000);
                });
            }

            copyBtn.addEventListener('click', copyLoadstring);

            // กด Ctrl+C หรือ Cmd+C ก็ copy ได้
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
                    const selection = window.getSelection().toString();
                    if (selection === loadstringText) {
                        copyLoadstring();
                    }
                }
            });
        })();
    </script>
</body>
</html>
